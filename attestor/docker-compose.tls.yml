# Production overlay: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Deploy the entire stack as the same ATTESTOR_APP_ID on tapp.
services:
  attestor-api:
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      ATTESTOR_TAPP_SOCKET: /run/tapp/tapp.sock
    volumes:
      - /run/tapp/tapp.sock:/run/tapp/tapp.sock
  attestor-worker:
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      ATTESTOR_TAPP_SOCKET: /run/tapp/tapp.sock
    volumes:
      - /run/tapp/tapp.sock:/run/tapp/tapp.sock
  attestor-indexer:
    environment:
      ATTESTOR_TAPP_SOCKET: /run/tapp/tapp.sock
    volumes:
      - /run/tapp/tapp.sock:/run/tapp/tapp.sock
  tls-init:
    image: ${TAPP_TLS_INIT_IMAGE:-us-central1-docker.pkg.dev/g-devops/zg-tapp/tls-init:v0.4.0}
    command:
      - --server=/run/tapp/tapp.sock
      - get-app-tls-cert
      - --app-id=${ATTESTOR_APP_ID:?ATTESTOR_APP_ID is required}
      - --out-key=/certs/tls.key
      - --out-cert=/certs/tls.crt
    volumes:
      - /run/tapp/tapp.sock:/run/tapp/tapp.sock
      - ${ATTESTOR_TLS_CERT_DIR:-/run/attestor-certs}:/certs
  attestor-tls:
    image: nginx:1.27-alpine
    depends_on:
      tls-init:
        condition: service_completed_successfully
      attestor-api:
        condition: service_started
    ports:
      - "${ATTESTOR_HTTPS_PORT:-8443}:443"
    volumes:
      - ${ATTESTOR_TLS_CERT_DIR:-/run/attestor-certs}:/etc/nginx/certs:ro
      - ./nginx-attested.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
