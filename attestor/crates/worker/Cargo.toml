[package]
name = "attestor-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "attestor-worker"
path = "src/main.rs"

[dependencies]
attestor-shared.workspace = true

tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

serde.workspace = true
serde_json.workspace = true

alloy.workspace = true
hex.workspace = true
base64.workspace = true

# 0g-storage Rust SDK (vendored core2 patch in attestor/Cargo.toml).
zg-storage-client.workspace = true

sqlx.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
# start_paused test runtime (auto-advancing timers) for the orphan-delete
# retry test — 20s backoffs must not run in real time.
tokio = { workspace = true, features = ["test-util"] }
