syntax = "proto3";

package tapp_service;

// Service definition
service TappService {
  // Start an application using Docker Compose content (async - returns task ID)
  rpc StartApp(StartAppRequest) returns (StartAppResponse);

  // Stop a running application (synchronous)
  rpc StopApp(StopAppRequest) returns (StopAppResponse);

  // Get task status for async operations
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);

  // List all deployed applications' measurement information
  rpc ListAppMeasurements(ListAppMeasurementsRequest)
      returns (ListAppMeasurementsResponse);

  // Get attestation evidence for external verifiers
  rpc GetEvidence(GetEvidenceRequest) returns (GetEvidenceResponse);

  // Get application-bound key from KBS based on app ID
  rpc GetAppKey(GetAppKeyRequest) returns (GetAppKeyResponse);

  // Get application secret key (private key) - local access only
  rpc GetAppSecretKey(GetAppSecretKeyRequest) returns (GetAppSecretKeyResponse);

  // Stable app signing identity from KMS (fixed provider material), socket only.
  rpc GetAppSigner(GetAppSignerRequest) returns (GetAppSignerResponse);

  // Get the app's TLS key and certificate - local access only.
  // The app writes two PEM files and points its server at them; no crypto work is left
  // to it. Where the key comes from is a deployment choice — see key_source in the
  // response, which decides whether the public key survives a restart.
  rpc GetAppTlsCert(GetAppTlsCertRequest) returns (GetAppTlsCertResponse);

  // A certificate signing request for a name of the caller's choosing, signed by the
  // app's TLS key.
  //
  // Public on purpose. A signing request carries a public key, a name, and a signature
  // proving the requester holds the private half — nothing the certificate it becomes
  // would not also publish. GetAppTlsCert stays socket-only because it hands over the
  // private key; this hands over none, and gating it would put an operator with shell
  // access between an app and its own certificate renewal for no gain.
  //
  // Why a request rather than the certificate GetAppTlsCert already returns: that one is
  // issued for <app-id>.tapp.0g.ai, and a public CA validates the names in the request
  // against the ones being ordered. Reusing it would fail every time. The key is the same
  // either way, which is what matters — a certificate issued from this carries the public
  // key the attestation already commits to, so a browser matching the CA's name and a
  // verifier matching the attested key both pass, reading different fields.
  rpc GetAppCsr(GetAppCsrRequest) returns (GetAppCsrResponse);

  // Get application information
  rpc GetAppInfo(GetAppInfoRequest) returns (GetAppInfoResponse);

  // List all apps currently on the server
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);

  // Get TAPP service configuration
  rpc GetTappInfo(GetTappInfoRequest) returns (GetTappInfoResponse);

  // Resolve another app through this tapp's configured, TLS-pinned Scan.
  // Unix socket only. The caller supplies the registry scope, never the Scan
  // URL or trust pin. Does not require KMS configuration or fetch any secret.
  rpc ResolveAppIdentity(ResolveAppIdentityRequest)
      returns (ResolveAppIdentityResponse);

  // Get service status and health information
  rpc GetServiceStatus(GetServiceStatusRequest)
      returns (GetServiceStatusResponse);

  // Get service logs with filtering options
  rpc GetServiceLogs(GetServiceLogsRequest) returns (GetServiceLogsResponse);

  // Get application logs (docker compose logs)
  rpc GetAppLogs(GetAppLogsRequest) returns (GetAppLogsResponse);

  // Permission Management (Owner only)
  // Add address to whitelist
  rpc AddToWhitelist(AddToWhitelistRequest) returns (AddToWhitelistResponse);

  // Remove address from whitelist
  rpc RemoveFromWhitelist(RemoveFromWhitelistRequest)
      returns (RemoveFromWhitelistResponse);

  // List all whitelisted addresses
  rpc ListWhitelist(ListWhitelistRequest) returns (ListWhitelistResponse);

  // App Ownership Tracking
  // Get ownership info for a specific app
  rpc GetAppOwnership(GetAppOwnershipRequest) returns (GetAppOwnershipResponse);

  // List all app ownerships
  rpc ListAllOwnerships(ListAllOwnershipsRequest)
      returns (ListAllOwnershipsResponse);

  // Ethereum Operations
  // Withdraw all ETH from app address to owner address
  rpc WithdrawBalance(WithdrawBalanceRequest) returns (WithdrawBalanceResponse);

  // Docker Operations
  // Login to Docker registry to pull private images
  rpc DockerLogin(DockerLoginRequest) returns (DockerLoginResponse);

  // Logout from Docker registry
  rpc DockerLogout(DockerLogoutRequest) returns (DockerLogoutResponse);

  // Prune unused Docker images
  rpc PruneImages(PruneImagesRequest) returns (PruneImagesResponse);

  // Service-level Operations
  // Stop a specific service within an app
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);

  // Start a specific service within an app
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);

  // Get application container status
  rpc GetAppContainerStatus(GetAppContainerStatusRequest)
      returns (GetAppContainerStatusResponse);

  // Get KMS-managed secret resource for this app. LOCAL ACCESS ONLY.
  // tapp signs the KMS request with its in-memory key, decrypts the response, and returns plaintext.
  rpc GetSecretResource(GetSecretResourceRequest)
      returns (GetSecretResourceResponse);

  // Claim this tapp: set owner + runtime configuration in one atomic measured step.
  // The signer of the request becomes the tapp owner; chain and KBS config are
  // applied immediately. Succeeds exactly once per boot; the full config is
  // extended into the runtime measurement (RTMR) so verifiers see the complete
  // runtime setup in the attestation evidence. Fails with ALREADY_EXISTS once claimed.
  //
  // Two modes:
  //   Pre-baked: owner/chain/kbs in config.toml → claimed automatically at startup.
  //   Dynamic:   image ships empty; first ClaimConfig call configures everything.
  rpc ClaimConfig(ClaimConfigRequest) returns (ClaimConfigResponse);

  // Replace the trust anchors this tapp uses — which KMS cluster it fetches key
  // material from, and which verifier it believes about that cluster's identity.
  //
  // ClaimConfig fixes these for the life of a boot, which does not survive contact
  // with reality: the verifier's TLS key is re-derived on every one of ITS boots, so
  // a single verifier restart would otherwise invalidate the pin on every tapp at
  // once and require re-claiming the fleet.
  //
  // Owner only, and every call is extended into the runtime measurement carrying the
  // resulting state in full. The measurement is what makes mutability safe rather
  // than a regression: the event log is append-only, so pointing a node at a
  // counterfeit verifier for five minutes leaves a permanent record anyone reading
  // the evidence can see. Mutable-and-unmeasured would be strictly worse than fixed.
  rpc UpdateTrustAnchors(UpdateTrustAnchorsRequest)
      returns (UpdateTrustAnchorsResponse);
}

enum LogLevel {
  DEBUG = 0;
  INFO = 1;
  WARNING = 2;
  ERROR = 3;
}

enum ServiceHealthStatus {
  HEALTHY = 0;
  UNHEALTHY = 1;
  UNKNOWN = 2;
}

// Task status for async operations
enum TaskStatus {
  PENDING = 0;    // Task is queued but not started
  RUNNING = 1;    // Task is currently running
  COMPLETED = 2;  // Task completed successfully
  FAILED = 3;     // Task failed with error
}

enum EvidenceFormat {
  RAW_QUOTE = 0;           // Raw TDX quote
  JSON_EVIDENCE = 1;       // JSON formatted evidence with metadata
  COMPOSITE_EVIDENCE = 2;  // Evidence with additional device attestations
}

// Start App Messages
message MountFile {
  string source_path = 1;  // Source path in compose file, e.g., ./nginx.conf
  bytes content = 2;       // File content (base64 encoded)
  string mode = 3;         // File permissions, e.g., "0644"
}

message StartAppRequest {
  string compose_content = 1;
  string app_id = 2;  // Application identifier for key binding
  repeated MountFile mount_files =
      3;  // Files to mount (mapped by source_path from compose volumes)
  // Pull images and compute measurements (compose/volumes/image hashes)
  // WITHOUT starting containers. Used by the CLI to register the app
  // on-chain before it actually runs; a follow-up StartApp (without this
  // flag) then starts the containers from the cached images.
  bool measure_only = 4;
}

message StartAppResponse {
  bool success = 1;
  string message = 2;
  string task_id = 3;   // Async task identifier for tracking progress
  int64 timestamp = 4;  // Timestamp of the start request
  // Compose lint findings: data placed where the encrypted volume cannot
  // protect it, and privilege escapes. Warnings, not errors — the start
  // proceeds; these exist so the person who wrote the compose SEES them
  // (a warning only in the server log protects nobody).
  repeated string compose_warnings = 5;
}

// Stop App Messages
message StopAppRequest {
  string app_id = 1;  // Application identifier to stop
}

message StopAppResponse {
  bool success = 1;
  string message = 2;
  int64 timestamp = 3;  // Timestamp of the stop request
}

// Task Status Messages
message GetTaskStatusRequest {
  string task_id = 1;  // Task identifier to query
}

message TaskResult {
  string app_id = 1;    // Application identifier (on success)
  string deployer = 2;  // Deployer EVM address (on success)
  string error = 3;     // Error message (on failure)
  // Measurements, set only for measure_only tasks (see StartAppRequest).
  string compose_hash = 4;                // Hash of compose file content
  map<string, string> volumes_hash = 5;   // Map: file_name -> hash
  map<string, string> image_hash = 6;     // Map: service_name -> image digest
}

message GetTaskStatusResponse {
  bool success = 1;
  string message = 2;
  string task_id = 3;
  TaskStatus status = 4;  // Current task status
  TaskResult result = 5;  // Task result (only available when completed/failed)
  int64 created_at = 6;   // Task creation timestamp
  int64 updated_at = 7;   // Last update timestamp
}

// List App Measurements Messages
message ListAppMeasurementsRequest {
  // Optional filters (empty means list all)
  string deployer_filter = 1;  // Filter by deployer (hex string)
}

message AppMeasurementInfo {
  string app_id = 1;        // Application identifier
  string operation = 2;     // "start_app", "stop_app", etc.
  string result = 3;        // "success" or "failed"
  string error = 4;         // Error message if failed
  string compose_hash = 5;  // Hash of compose file content
  string volumes_hash = 6;  // Hash of mounted volumes
  string deployer = 7;      // Deployer public key (hex)
  int64 timestamp = 8;      // Measurement timestamp
}

message ListAppMeasurementsResponse {
  bool success = 1;
  string message = 2;
  repeated AppMeasurementInfo measurements = 3;
  int32 total_count = 4;      // Total number of measurements
  string hash_algorithm = 5;  // Hash algorithm used globally (e.g., "sha256")
}

// Get Evidence Messages
message GetEvidenceRequest {
  string app_id = 1;  // Application identifier

  // Optional challenge, at most 64 bytes, echoed into the quote's report_data.
  //
  // A quote says nothing about when it was produced, so a cached blob looks exactly
  // like a fresh one. A caller that sends a random value per request can tell them
  // apart. A caller that fetches once and serves the result to many readers (and
  // reports it "as of" a timestamp) sends nothing and leaves the field out.
  //
  // report_data is sha512 of the `runtime_data` object returned alongside the quote;
  // see tapp_common::report_data.
  bytes nonce = 2;
}

message GetEvidenceResponse {
  bool success = 1;
  string message = 2;
  bytes evidence = 3;
  // Metadata
  string tee_type = 4;  // TEE type (e.g., "TDX", "SNP", "SGX")
  int64 timestamp = 5;  // Evidence generation timestamp
}

// Get App Key Messages (replaces GetPubkey)
message GetAppKeyRequest {
  string app_id = 1;            // Application identifier
  reserved 2, 5;
  reserved "key_type", "x25519";
  bytes additional_data = 3;    // Additional binding data
  string kbs_resource_uri = 4;  // KBS resource URI for key material
}

message GetAppKeyResponse {
  bool success = 1;
  string message = 2;

  // Fixed node-signer public key (64-byte secp256k1, no SEC1 prefix)
  bytes public_key = 3;  // Public key bytes
  // Ethereum address of the fixed node signer
  bytes eth_address = 4;        // 20-byte Ethereum address
  reserved 5;
  reserved "x25519_public_key";
  // Key provenance
  string key_source = 6;  // Source: "kbs", "in-memory"
}

// Dedicated app signer. Uses the existing hex(provider) KMS namespace so its
// secp256k1 address remains stable and compatible with existing sandbox providers.
message GetAppSignerRequest { string app_id = 1; }
message GetAppSignerResponse {
  bool success = 1;
  string message = 2;
  bytes secret = 3; // SENSITIVE: raw 32-byte secp256k1 scalar; socket only
  bytes public_key = 4; // 33-byte SEC1 compressed
  bytes eth_address = 5;
  string key_source = 6;
  string derivation = 7;
  string commitment_scheme = 8;
  bytes commitment = 9;
  bool measured_in_evidence = 10;
}

// Get App TLS Cert Messages (local access only — carries a private key)
message GetAppTlsCertRequest {
  string app_id = 1;  // Application identifier
}

message GetAppTlsCertResponse {
  bool success = 1;
  string message = 2;

  // The two files an ordinary TLS server wants. No crypto work left for the app.
  string key_pem = 3;
  string cert_pem = 4;

  // "ca" when a CA signed it, "self-signed" when none is configured. Self-signed is
  // not a lesser certificate here: what a verifier checks is the public key against
  // the quote, not the issuer. The issuer matters only to clients that will not do
  // that check — browsers, anything using a system trust store.
  string issuer = 5;

  // Always present, so the certificate can be reissued by whatever authority the
  // deployer prefers (Let's Encrypt, their own CA) without asking for the key again.
  string csr_pem = 6;

  // sha256 of the SubjectPublicKeyInfo, hex. This is the value the quote's report_data
  // commits to, so a verifier compares this against the key it was handed during the
  // handshake. Returned here to save every caller re-deriving it.
  string public_key_sha256 = 7;

  // "local" or "kms" — where the private key came from. This decides whether the public
  // key survives a restart, so a client choosing to pin it needs to know: "local" is
  // bound to this instance and changes when it restarts, "kms" is stable and shared by
  // every node of the app.
  string key_source = 8;
}

message GetAppCsrRequest {
  string app_id = 1;

  // The name to request, e.g. "api.example.com". Required: there is no useful default,
  // since the point of asking is that the caller wants a name this service did not choose.
  string domain = 2;
}

message GetAppCsrResponse {
  bool success = 1;
  string message = 2;
  string csr_pem = 3;

  // sha256 of the SubjectPublicKeyInfo, hex. The same value the quote's report_data
  // commits to, returned so a caller can confirm the request carries the attested key
  // before paying a CA to certify it.
  string public_key_sha256 = 4;

  // "local" or "kms" — whether this key survives a restart. A CA-issued certificate for a
  // local key is void the moment the node reboots, which matters before starting an ACME
  // order against a rate limit.
  string key_source = 5;
}

// Get App Secret Key Messages (local access only)
message GetAppSecretKeyRequest {
  string app_id = 1;    // Application identifier
  reserved 2, 3;
  reserved "key_type", "x25519";
}

message GetAppSecretKeyResponse {
  bool success = 1;
  string message = 2;

  // Secret key material (SENSITIVE - only for local access)
  bytes private_key = 3;        // Private key bytes (32 bytes for Ethereum)
  bytes public_key = 4;         // Public key bytes (for verification)
  bytes eth_address = 5;        // Ethereum address (if applicable)
  reserved 6;
  reserved "x25519_public_key";
}

message GetAppInfoRequest {
  string app_id = 1;
}

message GetAppInfoResponse {
  bool success = 1;
  string message = 2;

  string app_id = 3;
  string owner = 4;
  string compose_hash = 5;
  map<string, string> volumes_hash = 6;  // Map: file_name -> hash
  string compose_content = 7;
  map<string, string> image_hash = 9;  // Map: service_name -> image_hash
}

// List Apps Messages
message ListAppsRequest {}

message AppSummary {
  string app_id = 1;
  string owner = 2;
  string compose_hash = 3;
  uint32 image_count = 4;  // number of service images in the compose
}

message ListAppsResponse {
  bool success = 1;
  repeated AppSummary apps = 2;
}

// Get TAPP Info Messages
message GetTappInfoRequest {
  // No parameters needed
}

message LoggingConfigInfo {
  string level = 1;
  string format = 2;
  string file_path = 3;  // Empty if logging to stdout
}

message ServerConfigInfo {
  string bind_address = 1;
  int32 max_connections = 2;
  int32 request_timeout_seconds = 3;
  bool tls_enabled = 4;
  bool tls_cert_configured =
      5;  // Whether TLS cert is configured (path not exposed)
  bool permission_enabled = 6;
  string owner_address = 7;  // TAPP owner address (if permission enabled)
}

message BootConfigInfo {
  string aa_config_path = 1;  // Attestation agent config path
}

message RetryConfigInfo {
  int32 max_retries = 1;
  int32 initial_delay_ms = 2;
  int32 max_delay_ms = 3;
}

message KbsConfigInfo {
  repeated string node_urls = 1;
  int32 timeout_seconds = 2;
  bool cert_configured = 3;  // Whether custom CA cert is configured
  RetryConfigInfo retry = 4;
}


message TappConfigInfo {
  LoggingConfigInfo logging = 1;
  ServerConfigInfo server = 2;
  BootConfigInfo boot = 3;
  KbsConfigInfo kbs = 4;   // Null if KBS is not configured
  bool kbs_enabled = 5;
  reserved 6;  // was the claimed chain (see ClaimConfigRequest)
  reserved "chain";

  // Live trust anchors (see UpdateTrustAnchors). Empty when none is configured, which
  // means KMS node identities cannot be checked — not that they are checked and pass.
  string scan_url = 7;
  string scan_public_key = 8;
}

message GetTappInfoResponse {
  bool success = 1;
  string message = 2;
  TappConfigInfo config = 3;
  string version = 4;  // TAPP service version
}

// App ids are scoped by chain and TappRegistry, not globally unique.
message ResolveAppIdentityRequest {
  uint64 chain_id = 1;
  string registry_address = 2;
  string app_id = 3;
}

message ResolvedAppNodeIdentity {
  // Registered, attested node signer. This is NOT a KMS-derived service signer
  // (for example a SandboxServing provider); those require a separate binding.
  string node_signer = 1;
  // Management/evidence endpoint, not the app's business-service URL.
  string tee_url = 2;
  // SHA256 of the APP TLS SubjectPublicKeyInfo, 0x-prefixed hex. Do not use
  // this pin for tee_url: the management listener has its own TLS identity.
  string tls_spki_sha256 = 3;
  int64 checked_at = 4;
  // Acceptance deadline: min(Scan's expiry, checked_at + 300 seconds).
  // The result is a cached observation, not proof of liveness after checked_at.
  int64 expires_at = 5;
  string tcb_status = 6;
  repeated string advisories = 7;
  string image_env = 8;
  // Stable application signer, derived from an authenticated typed identity.
  // Empty when the app has not acquired one; never substitute node_signer.
  string app_signer = 9;
  repeated ResolvedKeyIdentity identities = 10;
  repeated ResolvedKeyCommitment key_commitments = 11;
  // Number of commitments with no replayed event recording attested KMS transport.
  uint64 kms_unchecked = 12;
}

message ResolvedKeyCommitment {
  string commitment = 1;
  string material = 2;
  string scheme = 3;
}

message ResolvedKeyIdentity {
  string algorithm = 1;
  string derivation = 2;
  ResolvedKeyCommitment key_ref = 3;
  string key_source = 4;
  string public_key = 5;
  string public_key_encoding = 6;
  string role = 7;
}

message ResolveAppIdentityResponse {
  bool success = 1;
  string message = 2;
  uint64 chain_id = 3;
  string registry_address = 4;
  string app_id = 5;
  repeated ResolvedAppNodeIdentity nodes = 6;
  // The single live trust-anchor snapshot used for this lookup.
  string scan_url = 7;
  string scan_public_key = 8;
  uint64 scanned_to_block = 9;
  int64 resolved_at = 10;
  // Current TappRegistry registration instance, never an observation timestamp.
  uint64 registered_at = 11;
  // Future typed service identities / commitment binding proofs can be added
  // as new fields. Nodes above must never be relabelled as service identities.
}

// Service Status Messages
message GetServiceStatusRequest {
  int32 log_lines =
      1;  // Number of recent log lines from journalctl (default: 50)
}

message GetServiceStatusResponse {
  bool success = 1;
  string message = 2;

  // Service information from systemd/journalctl
  string unit_name = 3;  // systemd unit name (e.g., "tapp-service.service")
  string active_state =
      4;                 // active, inactive, failed, activating, deactivating
  string sub_state = 5;  // running, dead, exited, failed, etc.
  int64 active_since_timestamp =
      6;          // When the service became active (unix timestamp)
  int32 pid = 7;  // Main process PID (0 if not running)

  // Recent logs from journalctl -u <unit> -n <lines>
  repeated string recent_logs = 8;
  int32 log_lines_returned = 9;

  int64 timestamp = 10;  // Response timestamp
  string version = 11;   // TAPP service version
}

// Service Logs Messages
message GetServiceLogsRequest {
  string file_name = 1;  // Log file name (if empty, list all available files)
  int32 lines =
      2;  // Number of lines to retrieve (default: 100, tail -n behavior)
          // If download_full is true, this parameter is ignored
  bool download_full =
      3;  // Download complete file content (ignores lines parameter)
}

message LogFileInfo {
  string file_name = 1;     // File name
  int64 size_bytes = 2;     // File size
  int64 modified_time = 3;  // Last modified timestamp
}

message GetServiceLogsResponse {
  bool success = 1;
  string message = 2;

  // If file_name is empty in request, return list of available files
  repeated LogFileInfo available_files = 3;

  // If file_name is specified, return file content
  string content =
      4;  // File content (last N lines, or full file if download_full=true)
  int32 total_lines = 5;  // Total lines returned
  int64 file_size = 6;    // File size in bytes (when download_full=true)
}

// Application Logs Messages
message GetAppLogsRequest {
  string app_id = 1;  // Application identifier
  int32 lines = 2;    // Number of lines to retrieve (default: 100)
  string service_name =
      3;  // Optional: specific service in compose (e.g., "web", "broker")
}

message GetAppLogsResponse {
  bool success = 1;
  string message = 2;
  string content = 3;     // Log content from docker compose logs
  int32 total_lines = 4;  // Total lines returned
}

// Permission Management Messages
message AddToWhitelistRequest {
  string evm_address = 1;  // EVM address to add (e.g., "0xabcd...")
}

message AddToWhitelistResponse {
  bool success = 1;
  string message = 2;
}

message RemoveFromWhitelistRequest {
  string evm_address = 1;  // EVM address to remove
}

message RemoveFromWhitelistResponse {
  bool success = 1;
  string message = 2;
}

message ListWhitelistRequest {
  // No parameters needed
}

message ListWhitelistResponse {
  bool success = 1;
  string message = 2;
  repeated string addresses = 3;  // List of whitelisted EVM addresses
}

// App Ownership Messages
enum AppStatus {
  ACTIVE = 0;
  STOPPED = 1;
}

message AppOwnershipInfo {
  string app_id = 1;
  string owner_address = 2;  // EVM address of the app owner (who started it)
  int64 started_at = 3;      // Unix timestamp when app was started
  AppStatus status = 4;      // Current app status
  int64 stopped_at = 5;  // Unix timestamp when app was stopped (0 if running)
}

message GetAppOwnershipRequest {
  string app_id = 1;
}

message GetAppOwnershipResponse {
  bool success = 1;
  string message = 2;
  AppOwnershipInfo ownership = 3;  // Ownership info (null if not found)
}

message ListAllOwnershipsRequest {
  // No parameters needed
}

message ListAllOwnershipsResponse {
  bool success = 1;
  string message = 2;
  repeated AppOwnershipInfo ownerships = 3;  // List of all app ownerships
}

// Ethereum Withdrawal Messages

message WithdrawBalanceRequest {
  string app_id = 1;    // Application identifier
  string rpc_url = 2;   // Ethereum RPC endpoint (e.g.,
                        // "https://eth-sepolia.g.alchemy.com/v2/...")
  uint64 chain_id = 3;  // Chain ID (e.g., 1 for mainnet, 11155111 for sepolia)
  string recipient =
      4;  // Optional: custom recipient address (defaults to tapp owner)
}

message WithdrawBalanceResponse {
  bool success = 1;
  string message = 2;
  string transaction_hash = 3;  // Transaction hash on success
  string from_address = 4;      // App's Ethereum address
  string to_address = 5;        // Recipient address
  string amount = 6;  // Amount transferred in Wei (as string to avoid overflow)
  uint64 gas_used = 7;   // Estimated gas used
  uint64 gas_price = 8;  // Gas price used (in Wei)
  int64 timestamp = 9;   // Operation timestamp
}

// Docker Login Messages
message DockerLoginRequest {
  string registry = 1;  // Docker registry URL (e.g.,
                        // "eliza-registry-vpc.ap-southeast-1.cr.aliyuncs.com")
                        // If empty, defaults to Docker Hub (docker.io)
  string username = 2;  // Registry username
  string password = 3;  // Registry password or access token
}

message DockerLoginResponse {
  bool success = 1;
  string message = 2;
  string registry = 3;  // Registry that was logged into
  string username = 4;  // Username used for login
  int64 timestamp = 5;  // Operation timestamp
}

// Docker Logout Messages
message DockerLogoutRequest {
  string registry = 1;  // Docker registry URL (e.g.,
                        // "eliza-registry-vpc.ap-southeast-1.cr.aliyuncs.com")
                        // If empty, defaults to Docker Hub (docker.io)
}

message DockerLogoutResponse {
  bool success = 1;
  string message = 2;
  string registry = 3;  // Registry that was logged out from
  int64 timestamp = 4;  // Operation timestamp
}

// Docker Prune Images Messages
message PruneImagesRequest {
  bool all =
      1;  // Remove all unused images, not just dangling ones (default: false)
}

message PruneImagesResponse {
  bool success = 1;
  string message = 2;
  int64 images_deleted = 3;            // Number of images deleted
  int64 space_reclaimed = 4;           // Disk space reclaimed in bytes
  repeated string deleted_images = 5;  // List of deleted image IDs/names
  int64 timestamp = 6;                 // Operation timestamp
}

// Service-level Operation Messages
message StopServiceRequest {
  string app_id = 1;        // Application identifier
  string service_name = 2;  // Service name from docker-compose.yml
}

message StopServiceResponse {
  bool success = 1;
  string message = 2;
  string app_id = 3;        // Application identifier
  string service_name = 4;  // Service that was stopped
  int64 timestamp = 5;      // Operation timestamp
}

message StartServiceRequest {
  string app_id = 1;        // Application identifier
  string service_name = 2;  // Service name from docker-compose.yml
  bool pull_image = 3;      // Whether to pull latest image (default: false)
}

message StartServiceResponse {
  bool success = 1;
  string message = 2;
  string task_id = 3;   // Async task identifier for tracking progress
  int64 timestamp = 4;  // Operation timestamp
}

// Get App Container Status Messages
message GetAppContainerStatusRequest {
  string app_id = 1;  // Application identifier
}

message GetAppContainerStatusResponse {
  bool success = 1;
  string message = 2;
  string app_id = 3;
  bool running = 4;                         // Whether the app is running
  int32 container_count = 5;                // Number of containers
  repeated ContainerStatus containers = 6;  // Container status details
  int64 started_at = 7;  // App start timestamp (Unix timestamp)
  int64 timestamp = 8;   // Response timestamp
}

message ContainerStatus {
  string name = 1;            // Container name
  string state = 2;           // Container state (running, stopped, etc.)
  string health = 3;          // Health status (if available)
  repeated string ports = 4;  // Port mappings (e.g., "0.0.0.0:8080->80/tcp")
}

// GetSecretResource Messages
message GetSecretResourceRequest {
  string app_id = 1;
  // Optional hex-encoded derivation material, forwarded verbatim to KMS
  // /app-key, which binds it into the derived key alongside app_id (e.g.
  // AgenticID: chainId || contractAddress || sealId). Absent/empty derives
  // purely from the app_id namespace, as before. From tapp-server 0.11.0 it is
  // refused (INVALID_ARGUMENT) unless it is hex (digits in either case, with an
  // optional 0x) of at most 256 bytes: it is written into the app's evidence.
  string material = 2;
}

message GetSecretResourceResponse {
  bool success = 1;
  string message = 2;
  bytes secret = 3;  // plaintext KMS-derived app key

  // Generic KMS bytes do not imply any signing algorithm.
  reserved 4, 5;
  reserved "eth_address", "compressed_public_key";
  string commitment_scheme = 6;
  bytes commitment = 7; // canonical 32-byte big-endian BN254 scalar field element
  bool measured_in_evidence = 8; // true only after the measurement was written

}

// ClaimConfig Messages
message ClaimConfigRequest {
  // Owner is the EVM address recovered from the request signature
  // (x-signature / x-timestamp metadata) — no explicit field needed.

  // 1, 2 were chain_rpc_url / chain_contract_address: a node "belonging" to one
  // registry was only ever a recorded label — registration is the CLI's, against
  // whatever registry it is pointed at, and the KMS checks its own — so one node can
  // be registered on several chains. Older clients still sending them are ignored.
  reserved 1, 2;
  reserved "chain_rpc_url", "chain_contract_address";

  // Optional: KMS cluster node URLs (e.g. "http://kms-1:9091").
  // When provided, the KMS client is initialized on this call (no config.toml
  // [kbs] section needed). Ignored if KBS was already configured at startup.
  repeated string kbs_node_urls = 3;

  // Optional: where app TLS private keys come from — "local" (default) or "kms".
  //
  // Here rather than in config.toml for the same reason the owner is: config.toml
  // lives in the CVM image, so a field there means a separate image and a separate
  // set of reference values per choice. Claimed instead, the image stays generic and
  // the choice becomes a measured fact a verifier can read out of the event log —
  // which matters, because it decides whether the attested public key survives a
  // restart.
  string tls_key_source = 4;

  // Optional: the verifier this tapp believes, and the key that proves it is talking
  // to that verifier and not to something answering in its place. Both or neither —
  // see UpdateTrustAnchorsRequest, which can change them later.
  string scan_url = 5;
  string scan_public_key = 6;
}

message ClaimConfigResponse {
  bool success = 1;
  string message = 2;
  string owner_address = 3;  // The claimed owner address (normalized)
  int64 timestamp = 4;       // Claim timestamp
}

message UpdateTrustAnchorsRequest {
  // Empty = leave unchanged. Replaces the cluster wholesale rather than merging,
  // because a set of nodes is what is being trusted, not each URL independently.
  repeated string kbs_node_urls = 1;

  // The verifier to ask about a KMS node's attested TLS key, and the sha256 of that
  // verifier's own TLS SubjectPublicKeyInfo (`0x…`, 32 bytes).
  //
  // These move together and are validated together. A URL without a pin is an
  // unauthenticated channel carrying an assertion, which is worse than having no
  // verifier configured at all — the answer would be trusted and is rewritable by
  // anyone on the path. A pin without a URL names nothing. `scan_url` must be
  // https for the same reason: a pinned key over plaintext proves nothing.
  //
  // Both empty = leave unchanged.
  string scan_url = 2;
  string scan_public_key = 3;
}

message UpdateTrustAnchorsResponse {
  bool success = 1;
  string message = 2;

  // The resulting anchors, so a caller confirms what took effect rather than
  // assuming its request was applied verbatim.
  repeated string kbs_node_urls = 3;
  string scan_url = 4;
  string scan_public_key = 5;
  int64 timestamp = 6;
}
